<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ノート">
  <meta name="application-name" content="勉強ノート">
  <meta name="theme-color" content="#f4f3ef">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="iPad と Apple Pencil のための手書きノート">
  <title>勉強ノート</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // 起動時のちらつき防止（テーマを先に決める）
    try {
      var s = JSON.parse(localStorage.getItem('bn.settings.v1') || '{}');
      var dark = s.theme === 'dark' || ((!s.theme || s.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <div id="library" class="view"></div>
    <div id="editor" class="view" hidden></div>
  </div>
  <div id="overlay-root"></div>
  <div id="boot-fallback" hidden style="position:fixed;inset:0;z-index:10000;place-items:center;padding:24px;background:#f4f3ef;color:#1c1c1f;font:16px/1.6 -apple-system,BlinkMacSystemFont,sans-serif">
    <section style="width:min(440px,100%);padding:28px;border-radius:24px;background:#fff;box-shadow:0 16px 48px #0002;text-align:center">
      <h1 style="margin:0 0 12px;font-size:22px">アプリを起動できません</h1>
      <p style="margin:0 0 20px;color:#64646c">起動処理が完了しませんでした。修復・更新ページを開くと、保存データを残したままアプリを更新できます。</p>
      <pre id="boot-detail" hidden style="max-height:180px;overflow:auto;margin:0 0 16px;padding:12px;border-radius:12px;background:#f3f3f6;color:#41414a;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.45 ui-monospace,SFMono-Regular,monospace"></pre>
      <button id="boot-reload" style="border:0;border-radius:14px;padding:12px 22px;background:#5b6cf0;color:#fff;font:600 15px -apple-system,BlinkMacSystemFont,sans-serif">再読み込み</button>
      <a href="recover-v1.6.5.html" style="display:block;margin-top:14px;color:#4d5fe4;font-weight:600">修復・更新ページを開く</a>
    </section>
  </div>
  <noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
  <script>
    // アプリ本体の起動に失敗しても、新しい Service Worker の確認だけは先に行う。
    try {
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
          .then((registration) => registration.update().catch(() => {}))
          .catch(() => {});
      }
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js?v=1.6.12"></script>
  <script>
    (() => {
      const root = document.documentElement;
      const fallback = document.getElementById('boot-fallback');
      const detail = document.getElementById('boot-detail');
      const showFallback = () => {
        if (root.classList.contains('ready')) return;
        if (detail.hidden && window.__appStartupStage) {
          detail.textContent = `応答が止まった処理: ${window.__appStartupStage}`;
          detail.hidden = false;
        }
        fallback.hidden = false;
        fallback.style.display = 'grid';
      };
      const describeFailure = (value) => {
        if (root.classList.contains('ready')) return;
        const err = value instanceof Error ? value : null;
        const message = err ? `${err.name}: ${err.message}` : String(value || '起動エラーの詳細を取得できませんでした');
        detail.textContent = (message + (err && err.stack ? `\n${err.stack}` : '')).slice(0, 1800);
        detail.hidden = false;
        showFallback();
      };
      document.getElementById('boot-reload').addEventListener('click', () => location.reload());
      window.addEventListener('error', (event) => {
        if (event.target && event.target !== window && event.target.tagName !== 'SCRIPT') return;
        describeFailure(event.error || event.message || (event.filename ? `Script load failed: ${event.filename}` : 'JavaScript error'));
      });
      window.addEventListener('unhandledrejection', (event) => describeFailure(event.reason));
      window.addEventListener('bn-startup-error', (event) => describeFailure(event.detail));
      const observer = new MutationObserver(() => {
        if (root.classList.contains('ready')) {
          fallback.hidden = true;
          observer.disconnect();
        }
      });
      observer.observe(root, { attributes: true, attributeFilter: ['class'] });
      setTimeout(showFallback, 12000);
    })();
  </script>
</body>
</html>
