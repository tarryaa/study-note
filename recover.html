<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f3ef">
  <title>勉強ノートの修復</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #202027; background: #f4f3ef; font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(440px, 100%); padding: 30px; border: 1px solid #e9e7e1; border-radius: 26px; background: #fff; box-shadow: 0 18px 60px #24242114; text-align: center; }
    .mark { width: 56px; height: 56px; display: grid; place-items: center; margin: 0 auto 18px; border-radius: 19px; color: #fff; background: linear-gradient(145deg, #7481f4, #5362dd); font-size: 27px; font-weight: 750; }
    h1 { margin: 0 0 10px; font-size: 23px; letter-spacing: -.03em; }
    p { margin: 0 0 20px; color: #686873; }
    #status { min-height: 28px; margin: 0 0 20px; color: #4f5fe0; font-weight: 650; }
    a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 0 22px; border-radius: 15px; color: #fff; background: #5b6cf0; font-weight: 700; text-decoration: none; }
    small { display: block; margin-top: 18px; color: #85858c; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">ノ</div>
    <h1>勉強ノートを修復</h1>
    <p>アプリの更新を確認しています。ノートの保存データには触れません。</p>
    <div id="status" role="status" aria-live="polite">更新を確認中…</div>
    <a href="./index.html">ノートを開く</a>
    <small>この画面が変わらない場合は、通信状態を確認してもう一度開いてください。</small>
  </main>
  <script>
    (() => {
      const EXPECTED = 'v1.6.2';
      const status = document.getElementById('status');
      let opening = false;
      const say = (message) => { status.textContent = message; };
      const openApp = () => {
        if (opening) return;
        opening = true;
        say('修復できました。ノートを開いています…');
        setTimeout(() => location.replace('./index.html?recovered=' + Date.now()), 450);
      };
      const versionOf = (worker) => new Promise((resolve) => {
        if (!worker) return resolve(null);
        const channel = new MessageChannel();
        const timer = setTimeout(() => { channel.port1.close(); resolve(null); }, 900);
        channel.port1.onmessage = (event) => {
          clearTimeout(timer);
          channel.port1.close();
          resolve(event.data);
        };
        try { worker.postMessage('getVersion', [channel.port2]); }
        catch (_) { clearTimeout(timer); channel.port1.close(); resolve(null); }
      });
      const watchInstall = (worker) => {
        if (!worker) return;
        worker.addEventListener('statechange', () => {
          if (worker.state === 'installed') {
            say('更新を適用しています…');
            worker.postMessage('skipWaiting');
          } else if (worker.state === 'activated') {
            openApp();
          } else if (worker.state === 'redundant' && !opening) {
            say('自動更新が完了しませんでした。通信を確認して再読み込みしてください。');
          }
        });
      };

      if (!('serviceWorker' in navigator)) {
        say('このブラウザでは自動修復できません。下のボタンからノートを開いてください。');
        return;
      }
      navigator.serviceWorker.addEventListener('controllerchange', openApp);
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(async (registration) => {
        registration.addEventListener('updatefound', () => watchInstall(registration.installing));
        if (registration.installing) watchInstall(registration.installing);
        if (registration.waiting) {
          say('更新を適用しています…');
          registration.waiting.postMessage('skipWaiting');
          return;
        }
        const active = registration.active || navigator.serviceWorker.controller;
        if (await versionOf(active) === EXPECTED) {
          openApp();
          return;
        }
        say('修正版を取得しています…');
        await registration.update();
        if (registration.waiting) {
          registration.waiting.postMessage('skipWaiting');
        } else if (registration.installing) {
          watchInstall(registration.installing);
        } else if (await versionOf(registration.active) === EXPECTED) {
          openApp();
        } else {
          say('更新を確認できませんでした。通信を確認して再読み込みしてください。');
        }
      }).catch(() => say('更新に接続できませんでした。通信を確認して、もう一度お試しください。'));
    })();
  </script>
</body>
</html>
